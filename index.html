<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario</title>

    <link rel="stylesheet" href="CSS/Sytle.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="card">

        <h2><i class="fa-solid fa-user"></i> Formulario</h2>

        <form>

            <div class="group">
                <label>Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="group">
                <label>Apellido</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>

            <div class="group">
                <label>Tipo de Identificación</label>
                <select name="tipo_identificacion">
                    <option selected disabled>Seleccione el tipo de documento...</option>
                    <option value="CC">Cédula de Ciudadanía (CC)</option>
                    <option value="TI">Tarjeta de Identidad (TI)</option>
                    <option value="PA">Pasaporte (PA)</option>
                </select>
            </div>

            <div class="group">
                <label>Número de Identificación</label>
                <input type="text" id="numero_identificacion"  name="numero_identificacion" required>
            </div>

            <div class="group">
                <label>Fecha de Nacimiento</label>
                <input type="date" name="fecha_nacimiento">
            </div>

            <div class="group">
                <label>Número de Celular</label>
                <input type="tel"
                    name="celular"
                    placeholder="Ej: 3004177843"
                    pattern="[0-9]{10}"
                    required>
            </div>

            <div class="group">
                <label>Correo Electrónico</label>
                <input type="email"
                    name="correo"
                    placeholder="micorreo@gmail.com"
                    required>
            </div>

            <div class="group">
                <label>País de domicilio</label>
                <input type="text" id="pais"  name="pais donde se ubica  required"> 
                <option selected disabled>Seleccione el pais donde se quiere ubicar</option>
                  <option value="es"> 724 España</option>
                  <option value="ca"> 124 Canadá</option>
                  <option value="mx"> 484 México</option>
                  <option value="cl"> 152 Chile</option>
                  <option value="Ar"> 032 argentina</option>
            </div>

            <div class="group">
                <label>Ciudad de domicilio</label>
                <input type="text" id="Ciudad" name="Ciudad donde se ubica required">
                <option selected disabled>Seleccione la ciudad donde se quiere ubicar</option>
                     <option value="es">Madrid</option>
                     <option value="ca">Toronto</option>
                     <option value="mx">Ciudad  de méxico</option>
                     <option value="cl">Santiago</option>
                     <option value="Ar">Buenos Aires</option>
            </div>

            <div class="group checkbox">
                <input type="checkbox" required>
                <label>Acepto la política de tratamiento de datos.</label>
            </div>

            <button class="btn" type="submit">
                <i class="fa-solid fa-paper-plane"></i>
                Enviar
            </button>

        </form>

        <footer class="footer">

            <p>© 2025 Formulario de contacto</p>

            <p class="footer-small">
                Todos los derechos reservados a Vannesa Castañeda
            </p>

            <nav class="footer-nav">
                <a href="privacidad.html">Política de Privacidad</a>
                <a href="terminos.html">Términos de Servicio</a>
                <a href="contacto.html">Contacto</a>
            </nav>

        </footer>

    </div>

</body>

</html>
