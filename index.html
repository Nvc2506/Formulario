
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario</title>

    <link rel="stylesheet" href="CSS/Sytle.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="card">

        <h2>
            <i class="fa-solid fa-user"></i>
            Formulario
        </h2>

        <form id="Formulario" action="#">

            <!-- NOMBRE -->
            <div class="group">

                <label for="nombre">
                    Nombre
                </label>

                <input type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingrese su nombre"
                    required>

            </div>


            <!-- APELLIDO -->
            <div class="group">

                <label for="apellido">
                    Apellido
                </label>

                <input type="text"
                    id="apellido"
                    name="apellido"
                    placeholder="Ingrese su apellido"
                    required>

            </div>


            <!-- TIPO DE IDENTIFICACIÓN -->
            <div class="group">

                <label for="tipo_identificacion">
                    Tipo de Identificación
                </label>

                <select id="tipo_identificacion"
                    name="tipo_identificacion"
                    required>

                    <option value="" selected disabled>
                        Seleccione el tipo de documento...
                    </option>

                    <option value="CC">
                        Cédula de Ciudadanía (CC)
                    </option>

                    <option value="TI">
                        Tarjeta de Identidad (TI)
                    </option>

                    <option value="PA">
                        Pasaporte (PA)
                    </option>

                </select>

            </div>


            <!-- NÚMERO DE IDENTIFICACIÓN -->
            <div class="group">

                <label for="numero_identificacion">
                    Número de Identificación
                </label>

                <input type="text"
                    id="numero_identificacion"
                    name="numero_identificacion"
                    placeholder="Ej: 1234567890"
                    required>

            </div>


            <!-- FECHA DE NACIMIENTO -->
            <div class="group">

                <label for="fecha_nacimiento">
                    Fecha de Nacimiento
                </label>

                <input type="date"
                    id="fecha_nacimiento"
                    name="fecha_nacimiento"
                    placeholder="Seleccione su fecha de nacimiento"
                    required>

            </div>


            <!-- CELULAR -->
            <div class="group">

                <label for="celular">
                    Número de Celular
                </label>

                <input type="tel"
                    id="celular"
                    name="celular"
                    placeholder="Ej: 3004177843"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required>

            </div>


            <!-- CORREO -->
            <div class="group">

                <label for="correo">
                    Correo Electrónico
                </label>

                <input type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ej: micorreo@gmail.com"
                    required>

            </div>


            <!-- PAÍS Y CIUDAD -->
            <div class="group">

                <label for="ciudad">
                    País y ciudad de domicilio
                </label>

                <select id="ciudad"
                    name="ciudad"
                    required>

                    <option value="" selected disabled>
                        Seleccione país y ciudad...
                    </option>

                    <optgroup label="España">
                        <option value="Madrid">
                            Madrid
                        </option>

                        <option value="Barcelona">
                            Barcelona
                        </option>

                        <option value="Sevilla">
                            Sevilla
                        </option>

                        <option value="Valencia">
                            Valencia
                        </option>

                        <option value="Bilbao">
                            Bilbao
                        </option>
                    </optgroup>

                    <optgroup label="Canadá">
                        <option value="Toronto">
                            Toronto
                        </option>

                        <option value="Vancouver">
                            Vancouver
                        </option>

                        <option value="Montreal">
                            Montreal
                        </option>

                        <option value="Ottawa">
                            Ottawa
                        </option>

                        <option value="Calgary">
                            Calgary
                        </option>
                    </optgroup>

                    <optgroup label="México">
                        <option value="Ciudad de México">
                            Ciudad de México
                        </option>

                        <option value="Guadalajara">
                            Guadalajara
                        </option>

                        <option value="Monterrey">
                            Monterrey
                        </option>

                        <option value="Puebla">
                            Puebla
                        </option>

                        <option value="Cancún">
                            Cancún
                        </option>
                    </optgroup>

                </select>

            </div>


            <!-- POLÍTICA DE DATOS -->
            <div class="group checkbox">

                <input type="checkbox"
                    id="politica"
                    name="politica"
                    required>

                <label for="politica">
                    Acepto la política de tratamiento de datos.
                </label>

            </div>


            <!-- BOTÓN -->
            <button type="submit" class="btn">
                Enviar Registro
            </button>

        </form>


        <!-- FOOTER -->
        <footer class="footer">

            <p>
                © 2026 Formulario de contacto
            </p>

            <p class="footer-small">
                Todos los derechos reservados a Vannesa Castañeda
            </p>

            <nav class="footer-nav">

                <a href="privacidad.html">
                    Política de Privacidad
                </a>

                <a href="terminos.html">
                    Términos de Servicio
                </a>

                <a href="contacto.html">
                    Contacto
                </a>

            </nav>

        </footer>

    </div>

</body>

</html>
